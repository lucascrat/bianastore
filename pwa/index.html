<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#b0004a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="BianaStore"/>
<meta name="description" content="Moda feminina com estilo — shop video feed"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-180.png"/>
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-rounded.png"/>
<title>BianaStore</title>

<!-- Fonts (text fonts from Google Fonts; icon font self-hosted so icons never show as text) -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  /* Self-hosted Material Symbols Outlined — eliminates dependency on Google Fonts CDN.
     The woff2 file is served by our own nginx, cached by the service worker after first
     load, and available offline from the second visit onwards. */
  @font-face {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: 100 700;
    font-display: block;
    src: url('/fonts/material-symbols-outlined.woff2') format('woff2');
  }
</style>

<!-- Efí card tokenization (turns card data into a payment_token client-side — raw card numbers never reach our server) -->
<script src="https://cdn.jsdelivr.net/npm/payment-token-efi/dist/payment-token-efi-umd.min.js"></script>

<style>
/* ─── Design Tokens ─────────────────────────────────── */
:root {
  --primary: #b0004a;
  --primary-dark: #d81b60;
  --on-primary: #ffffff;
  --primary-container: #d81b60;
  --primary-fixed: #ffd9de;
  --primary-fixed-dim: #ffb2bf;
  --secondary: #5f5e5e;
  --on-secondary: #ffffff;
  --secondary-container: #e2dfde;
  --tertiary: #ad0059;
  --tertiary-container: #d12672;
  --background: #f8f9fa;
  --on-background: #191c1d;
  --surface: #f8f9fa;
  --on-surface: #191c1d;
  --on-surface-variant: #5a4044;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #f3f4f5;
  --surface-container: #edeeef;
  --surface-container-high: #e7e8e9;
  --surface-container-highest: #e1e3e4;
  --surface-dim: #d9dadb;
  --surface-variant: #e1e3e4;
  --outline: #8e6f74;
  --outline-variant: #e3bdc3;
  --error: #ba1a1a;
  --error-container: #ffdad6;
  --surface-tint: #bc004f;
  --inverse-surface: #2e3132;
  --inverse-on-surface: #f0f1f2;
  --shadow-pink: rgba(216,27,96,0.12);
  --shadow-pink-sm: rgba(216,27,96,0.06);
}

/* ─── Reset ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  background: var(--background);
  color: var(--on-background);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
input, textarea { font: inherit; }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }

/* ─── App Shell ─────────────────────────────────────── */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--background);
  box-shadow: 0 0 60px rgba(0,0,0,0.08);
}

/* ─── Top Bar ───────────────────────────────────────── */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px var(--shadow-pink);
}
.top-bar-logo {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.03em;
}
.top-bar-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: var(--primary);
  transition: background 0.15s, transform 0.1s;
}
.top-bar-icon:active { transform: scale(0.9); background: var(--primary-fixed); }
.cart-badge {
  position: relative;
}
.cart-badge-dot {
  position: absolute;
  top: 4px; right: 4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 6px var(--primary);
}

/* ─── Screens ───────────────────────────────────────── */
.screen {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s ease, visibility 0s 0.2s;
  background: var(--background);
}
.screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity 0.2s ease, visibility 0s 0s;
}
/* Feed screen no scroll (snap) */
#screen-feed {
  overflow: hidden;
  background: #000;
}

/* ─── Bottom Nav ────────────────────────────────────── */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 8px);
  background: rgba(255,255,255,0.80);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
  z-index: 100;
  border-radius: 20px 20px 0 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  color: var(--secondary);
  opacity: 0.6;
  transition: color 0.15s, opacity 0.15s, transform 0.1s;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  position: relative;
}
.nav-item.active {
  color: var(--primary);
  opacity: 1;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  width: 32px; height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--primary);
  box-shadow: 0 2px 8px var(--primary);
}
.nav-item:active { transform: scale(0.9); }
.nav-item .material-symbols-outlined { font-size: 26px; }
.nav-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 20px);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
}

/* ─── FEED SCREEN ───────────────────────────────────── */
.feed-container {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.feed-item {
  height: 100dvh;
  scroll-snap-align: start;
  position: relative;
  background: #111;
  overflow: hidden;
}
.feed-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transform: scale(1.05);
}
.feed-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%, rgba(0,0,0,0.2) 100%);
}
.feed-actions {
  position: absolute;
  right: 12px;
  bottom: 140px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.feed-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.feed-action-btn .icon-circle {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.feed-action-btn:active .icon-circle { transform: scale(0.85); }
.feed-action-btn.liked .icon-circle { background: rgba(176,0,74,0.6); }
.feed-action-btn .material-symbols-outlined { font-size: 24px; color: #fff; }
/* Was ".feed-action-btn span:last-child" — but the icon <span> is the sole
   child of .icon-circle, so it also matched ":last-child" and its higher
   specificity silently overrode the icon font-family back to Hanken Grotesk
   (icons rendered as literal text: "favorite", "share"...). Scoped to a
   dedicated class instead so it can never again catch the icon span. */
.feed-action-label {
  font-size: 11px; font-weight: 700;
  font-family: 'Hanken Grotesk', sans-serif;
  letter-spacing: 0.04em;
}

/* ─── LIKE ANIMATIONS (Instagram/TikTok-style) ────────── */
@keyframes heartPop {
  0% { transform: scale(1); }
  30% { transform: scale(1.35); }
  55% { transform: scale(0.9); }
  100% { transform: scale(1); }
}
.icon-circle.pop { animation: heartPop 0.4s ease; }

@keyframes floatHeart {
  0% { transform: translate(0,0) scale(0.5) rotate(var(--rot,0deg)); opacity: 0; }
  12% { opacity: 1; transform: translate(0,-10px) scale(1.15) rotate(var(--rot,0deg)); }
  100% { transform: translate(var(--drift,0px), -190px) scale(0.75) rotate(var(--rot,0deg)); opacity: 0; }
}
.floating-heart {
  position: absolute;
  right: 16px;
  bottom: 200px;
  font-size: 26px;
  color: #ff3b5c;
  pointer-events: none;
  animation: floatHeart 1.3s ease-out forwards;
  z-index: 5;
  text-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

@keyframes bigHeartBurst {
  0% { transform: translate(-50%,-50%) scale(0); opacity: 0; }
  25% { transform: translate(-50%,-50%) scale(1.2); opacity: 1; }
  40% { transform: translate(-50%,-50%) scale(0.95); }
  60% { transform: translate(-50%,-50%) scale(1.05); }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 0; }
}
.big-heart-burst {
  position: absolute;
  top: 50%; left: 50%;
  font-size: 120px;
  color: #fff;
  pointer-events: none;
  z-index: 6;
  animation: bigHeartBurst 0.9s ease forwards;
  text-shadow: 0 4px 24px rgba(0,0,0,0.35);
}
.feed-product-card {
  position: absolute;
  bottom: 72px;
  left: 12px;
  right: 72px;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 16px;
  padding: 12px 14px;
  cursor: pointer;
  transition: transform 0.15s;
}
.feed-product-card:active { transform: scale(0.97); }
.feed-product-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.feed-prices { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.feed-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px; font-weight: 800;
  color: var(--primary);
}
.feed-price-old {
  font-size: 13px; font-weight: 400;
  color: var(--secondary);
  text-decoration: line-through;
}
.feed-buy-btn {
  width: 100%;
  padding: 9px;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em;
  transition: opacity 0.15s, transform 0.1s;
}
.feed-buy-btn:active { transform: scale(0.97); opacity: 0.9; }
.feed-sale-chip {
  position: absolute;
  top: 12px; left: 12px;
  background: var(--primary-dark);
  color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 99px;
  font-family: 'Hanken Grotesk', sans-serif;
  letter-spacing: 0.04em;
  animation: bounce-in 0.4s ease;
}
@keyframes bounce-in {
  0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}
}

/* ─── SHOP SCREEN ───────────────────────────────────── */
.shop-screen { padding-top: 60px; padding-bottom: 80px; }
.shop-header { padding: 16px 16px 8px; }
.shop-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--on-background);
  margin-bottom: 12px;
}
.category-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.category-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 13px; font-weight: 600;
  font-family: 'Hanken Grotesk', sans-serif;
  border: 1.5px solid var(--outline-variant);
  color: var(--on-surface-variant);
  background: var(--surface-container-lowest);
  transition: all 0.15s;
  cursor: pointer;
}
.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.chip:active { transform: scale(0.95); }
.products-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 12px 0;
}
.product-card {
  background: var(--surface-container-lowest);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 16px var(--shadow-pink-sm);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.product-card:active { transform: scale(0.97); }
.product-card-img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: var(--surface-container);
  position: relative;
}
.product-card-img-wrap { position: relative; }
.product-card-fav {
  position: absolute;
  top: 8px; right: 8px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: transform 0.1s;
}
.product-card-fav:active { transform: scale(0.85); }
.product-card-fav .material-symbols-outlined { font-size: 18px; color: var(--on-surface-variant); }
.product-card-fav.active .material-symbols-outlined { color: var(--primary); }
.product-card-badge {
  position: absolute;
  bottom: 8px; left: 8px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px);
  padding: 3px 8px;
  border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 800;
  color: var(--primary);
}
.product-card-info { padding: 10px 10px 12px; }
.product-card-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.product-card-sub {
  font-size: 11px; color: var(--on-surface-variant);
  margin-bottom: 4px;
}
.product-card-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 800;
  color: var(--primary);
}
.product-card-old {
  font-size: 11px; color: var(--secondary);
  text-decoration: line-through;
  margin-left: 4px;
}

/* ─── PRODUCT DETAIL SCREEN ─────────────────────────── */
.product-detail-screen { padding-top: 0; padding-bottom: 88px; }
.detail-gallery {
  position: relative;
  height: 55vh;
  overflow: hidden;
  background: var(--surface-container);
}
.detail-gallery img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.detail-gallery-dots {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px;
}
.detail-gallery-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
}
.detail-gallery-dots span.active { background: #fff; width: 18px; border-radius: 3px; }
.detail-back {
  position: absolute;
  top: 68px; left: 12px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 10;
  color: var(--primary);
  transition: transform 0.1s;
}
.detail-back:active { transform: scale(0.9); }
.detail-body { padding: 20px 16px; background: var(--surface-container-lowest); border-radius: 20px 20px 0 0; margin-top: -16px; position: relative; }
.detail-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--on-surface);
  margin-bottom: 4px;
}
.detail-sub { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 12px; }
.detail-prices { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
.detail-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 26px; font-weight: 800; color: var(--primary);
}
.detail-price-old { font-size: 15px; color: var(--secondary); text-decoration: line-through; }
.section-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 10px;
}
.size-row { display: flex; gap: 8px; margin-bottom: 20px; }
.size-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--outline);
  color: var(--on-surface-variant);
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.size-btn.active { border-color: var(--primary); border-width: 2px; background: rgba(176,0,74,0.06); color: var(--primary); }
.size-btn:active { transform: scale(0.92); }
.color-row { display: flex; gap: 10px; margin-bottom: 20px; }
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.1s;
  position: relative;
}
.color-swatch.active::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid var(--primary);
}
.color-swatch:active { transform: scale(0.85); }
.detail-desc {
  font-size: 14px; line-height: 1.6;
  color: var(--on-surface-variant);
  margin-bottom: 24px;
}
.detail-add-btn {
  position: sticky;
  bottom: 80px;
  width: 100%;
  padding: 16px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(176,0,74,0.35);
  z-index: 10;
  transition: opacity 0.15s, transform 0.1s;
  margin: 0 0 8px;
}
.detail-add-btn:active { transform: scale(0.97); }
.detail-add-btn .material-symbols-outlined { font-size: 20px; }
.reviews-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 16px;
}
.stars { color: #FFAA00; font-size: 14px; }
.reviews-count { font-size: 13px; color: var(--on-surface-variant); }

/* ─── CART SCREEN ───────────────────────────────────── */
.cart-screen { padding-top: 60px; padding-bottom: 80px; }
.cart-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--on-background);
}
.cart-count { font-size: 14px; color: var(--secondary); }
.cart-header { padding: 16px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
.cart-item {
  display: flex; gap: 12px;
  background: var(--surface-container-lowest);
  border-radius: 16px;
  padding: 12px;
  margin: 0 12px 10px;
  box-shadow: 0 3px 12px var(--shadow-pink-sm);
}
.cart-item-img {
  width: 80px; height: 100px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--surface-container);
  flex-shrink: 0;
}
.cart-item-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.cart-item-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--on-surface);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cart-item-variant { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
.cart-item-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 800; color: var(--primary);
}
.cart-item-price-old { font-size: 12px; color: var(--secondary); text-decoration: line-through; }
.qty-control {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface-container-low);
  border-radius: 99px;
  padding: 2px 4px;
}
.qty-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--on-surface-variant);
  transition: background 0.1s, transform 0.1s;
}
.qty-btn:active { background: var(--surface-container-high); transform: scale(0.85); }

  font-size: 15px; font-weight: 800; letter-spacing: 0.02em;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 8px 20px rgba(176,0,74,0.35);
  animation: qbCtaPulse 1.6s ease-in-out infinite;
}
.quick-buy-cta:active { transform: scale(0.98); }
.quick-buy-cta:disabled { animation: none; opacity: 0.7; cursor: default; }
@keyframes qbCtaPulse { 0%,100%{box-shadow:0 8px 20px rgba(176,0,74,0.35)} 50%{box-shadow:0 8px 28px rgba(176,0,74,0.55)} }
.quick-buy-secure { text-align: center; font-size: 11.5px; color: var(--on-surface-variant); margin-top: 10px; }

/* ─── MISC ──────────────────────────────────────────── */
.material-symbols-outlined {
  font-family: 'Material Symbols Outlined';
  font-weight: normal; font-style: normal;
  line-height: 1; letter-spacing: normal; text-transform: none;
  display: inline-block; white-space: nowrap;
  direction: ltr; -webkit-font-smoothing: antialiased;
}
.hidden { display: none !important; }
.scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }

/* ─── AUTH (login/cadastro) ─────────────────────────── */
.auth-tabs { display: flex; margin: 16px 12px 0; background: var(--surface-container-low); border-radius: 99px; padding: 4px; }
.auth-tab { flex: 1; text-align: center; padding: 10px; border-radius: 99px; font-weight: 700; font-size: 14px; color: var(--on-surface-variant); cursor: pointer; }
.auth-tab.active { background: var(--primary); color: #fff; }
.auth-avatar-upload {
  width: 88px; height: 88px; border-radius: 50%; margin: 20px auto 8px;
  background: var(--surface-container-low); border: 2px dashed var(--outline);
  display: flex; align-items: center; justify-content: center; position: relative;
  cursor: pointer; overflow: hidden;
}
.auth-avatar-upload img { width: 100%; height: 100%; object-fit: cover; }
.auth-avatar-upload .material-symbols-outlined { font-size: 32px; color: var(--outline); }
.auth-avatar-hint { text-align: center; font-size: 12px; color: var(--on-surface-variant); margin-bottom: 8px; }
.auth-error { margin: 0 16px; padding: 10px 14px; background: var(--error-container); color: var(--error); border-radius: 10px; font-size: 13px; }

/* ─── COMMENTS ──────────────────────────────────────── */
.comments-list { padding: 8px 16px; }
.comment-item { display: flex; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--surface-container-high); }
.comment-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-fixed); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex-shrink: 0; overflow: hidden; }
.comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
.comment-body { flex: 1; }
.comment-name { font-weight: 700; font-size: 13px; color: var(--on-surface); }
.comment-text { font-size: 14px; color: var(--on-surface); margin-top: 2px; }
.comment-time { font-size: 11px; color: var(--on-surface-variant); margin-top: 4px; }
.comment-input-bar { position: sticky; bottom: 0; display: flex; gap: 8px; padding: 10px 16px; background: var(--surface-container-lowest); border-top: 1px solid var(--surface-container-high); }
.comment-input-bar input { flex: 1; border: 1px solid var(--outline-variant); border-radius: 99px; padding: 10px 16px; font-size: 14px; font-family: 'Hanken Grotesk', sans-serif; outline: none; }
.comment-send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: #fff; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
.scrollbar-hide::-webkit-scrollbar { display: none; }
</style>
</head>

<body>
<div id="app">

  <!-- ─ TOP BAR ──────────────────────────────────────── -->
  <header class="top-bar" id="topBar">
    <button class="top-bar-icon" id="topBarLeft" onclick="handleTopLeft()">
      <span class="material-symbols-outlined" id="topBarLeftIcon">menu</span>
    </button>
    <span class="top-bar-logo">BianaStore</span>
    <button class="top-bar-icon cart-badge" onclick="navigateTo('cart')">
      <span class="material-symbols-outlined">shopping_bag</span>
      <span class="cart-badge-dot" id="cartDot"></span>
    </button>
  </header>

  <!-- ─ SCREENS ──────────────────────────────────────── -->

  <!-- FEED -->
  <div class="screen active" id="screen-feed">
    <div class="feed-container scrollbar-hide" id="feedContainer">
      <!-- Items injected by JS -->
    </div>
  </div>

  <!-- SHOP -->
  <div class="screen" id="screen-shop">
    <div class="shop-screen scrollbar-hide">
      <div class="shop-header">
        <h2 class="shop-title">Explorar</h2>
        <div class="category-chips" id="categoryChips"></div>
      </div>
      <div class="products-grid" id="productsGrid"></div>
    </div>
  </div>

  <!-- PRODUCT DETAIL -->
  <div class="screen" id="screen-product">
    <div class="product-detail-screen scrollbar-hide" id="productDetailContent"></div>
  </div>

  <!-- CART -->
  <div class="screen" id="screen-cart">
    <div class="cart-screen scrollbar-hide" id="cartContent"></div>
  </div>

  <!-- CHECKOUT -->
  <div class="screen" id="screen-checkout">
    <div class="checkout-screen scrollbar-hide" id="checkoutContent"></div>
  </div>

  <!-- ORDER CONFIRMATION -->
  <div class="screen" id="screen-confirm">
    <div class="scrollbar-hide" style="height:100%;overflow-y:auto;padding-top:60px;" id="confirmContent"></div>
  </div>

  <!-- PIX PAYMENT (waiting for confirmation) -->
  <div class="screen" id="screen-pix-wait">
    <div class="scrollbar-hide" style="height:100%;overflow-y:auto" id="pixWaitContent"></div>
  </div>

  <!-- FAVORITES -->
  <div class="screen" id="screen-favorites">
    <div class="fav-screen scrollbar-hide" id="favContent"></div>
  </div>

  <!-- ORDERS -->
  <div class="screen" id="screen-orders">
    <div class="orders-screen scrollbar-hide" id="ordersContent"></div>
  </div>

  <!-- NOTIFICATIONS -->
  <div class="screen" id="screen-notifications">
    <div class="notif-screen scrollbar-hide" id="notifContent"></div>
  </div>

  <!-- PROFILE -->
  <div class="screen" id="screen-profile">
    <div class="profile-screen scrollbar-hide" id="profileContent"></div>
  </div>

  <!-- AUTH (login / cadastro) -->
  <div class="screen" id="screen-auth">
    <div class="scrollbar-hide" style="height:100%;overflow-y:auto" id="authContent"></div>
  </div>

  <!-- COMMENTS -->
  <div class="screen" id="screen-comments">
    <div class="scrollbar-hide" style="height:100%;display:flex;flex-direction:column;overflow:hidden" id="commentsContent"></div>
  </div>

  <!-- ─ BOTTOM NAV ───────────────────────────────────── -->
  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-item active" id="nav-feed" onclick="navigateTo('feed')">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1">home</span>
      <span>Home</span>
    </button>
    <button class="nav-item" id="nav-shop" onclick="navigateTo('shop')">
      <span class="material-symbols-outlined">storefront</span>
      <span>Shop</span>
    </button>
    <button class="nav-item" id="nav-favorites" onclick="navigateTo('favorites')">
      <span class="material-symbols-outlined">favorite_border</span>
      <span>Saved</span>
    </button>
    <button class="nav-item" id="nav-orders" onclick="navigateTo('orders')">
      <span class="material-symbols-outlined">package_2</span>
      <span>Pedidos</span>
    </button>
    <button class="nav-item" id="nav-profile" onclick="navigateTo('profile')">
      <span class="material-symbols-outlined">person_outline</span>
      <span>Perfil</span>
    </button>
  </nav>

  <!-- ─ INSTALL BANNER ───────────────────────────────── -->
  <div class="install-banner" id="installBanner">
    <div class="install-banner-icon">
      <span class="material-symbols-outlined">shopping_bag</span>
    </div>
    <div class="install-banner-text">
      <div class="install-banner-title">Instalar BianaStore</div>
      <div class="install-banner-sub">Acesso rápido na tela inicial</div>
    </div>
    <button class="install-banner-btn" id="installBtn">Instalar</button>
    <button class="install-banner-close" onclick="dismissInstall()">
      <span class="material-symbols-outlined">close</span>
    </button>
  </div>

  <!-- ─ QUICK BUY (urgency bottom sheet) ────────────────── -->
  <div class="quick-buy-overlay" id="quickBuyOverlay" onclick="if(event.target===this) closeQuickBuy()">
    <div class="quick-buy-sheet">
      <div class="quick-buy-handle"></div>
      <button class="quick-buy-close" onclick="closeQuickBuy()">
        <span class="material-symbols-outlined">close</span>
      </button>
      <div id="quickBuyContent"></div>
    </div>
  </div>

  <!-- ─ TOAST ────────────────────────────────────────── -->
  <div class="toast" id="toast"></div>

</div>

<script src="app.js?v=8" defer></script>
</body>
</html>
