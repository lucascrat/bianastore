<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="theme-color" content="#b0004a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="BianaStore"/>
<meta name="description" content="Moda feminina com estilo — shop video feed"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>BianaStore</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Hanken+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>

<style>
/* ─── Design Tokens ─────────────────────────────────── */
:root {
  --primary: #b0004a;
  --primary-dark: #d81b60;
  --on-primary: #ffffff;
  --primary-container: #d81b60;
  --primary-fixed: #ffd9de;
  --primary-fixed-dim: #ffb2bf;
  --secondary: #5f5e5e;
  --on-secondary: #ffffff;
  --secondary-container: #e2dfde;
  --tertiary: #ad0059;
  --tertiary-container: #d12672;
  --background: #f8f9fa;
  --on-background: #191c1d;
  --surface: #f8f9fa;
  --on-surface: #191c1d;
  --on-surface-variant: #5a4044;
  --surface-container-lowest: #ffffff;
  --surface-container-low: #f3f4f5;
  --surface-container: #edeeef;
  --surface-container-high: #e7e8e9;
  --surface-container-highest: #e1e3e4;
  --surface-dim: #d9dadb;
  --surface-variant: #e1e3e4;
  --outline: #8e6f74;
  --outline-variant: #e3bdc3;
  --error: #ba1a1a;
  --error-container: #ffdad6;
  --surface-tint: #bc004f;
  --inverse-surface: #2e3132;
  --inverse-on-surface: #f0f1f2;
  --shadow-pink: rgba(216,27,96,0.12);
  --shadow-pink-sm: rgba(216,27,96,0.06);
}

/* ─── Reset ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Hanken Grotesk', sans-serif;
  background: var(--background);
  color: var(--on-background);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}
button { cursor: pointer; border: none; background: none; font: inherit; color: inherit; }
input, textarea { font: inherit; }
img { max-width: 100%; display: block; }
a { text-decoration: none; color: inherit; }

/* ─── App Shell ─────────────────────────────────────── */
#app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  max-width: 480px;
  margin: 0 auto;
  overflow: hidden;
  background: var(--background);
  box-shadow: 0 0 60px rgba(0,0,0,0.08);
}

/* ─── Top Bar ───────────────────────────────────────── */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  z-index: 100;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 4px 20px var(--shadow-pink);
}
.top-bar-logo {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px;
  font-weight: 800;
  color: var(--primary);
  letter-spacing: -0.03em;
}
.top-bar-icon {
  width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%;
  color: var(--primary);
  transition: background 0.15s, transform 0.1s;
}
.top-bar-icon:active { transform: scale(0.9); background: var(--primary-fixed); }
.cart-badge {
  position: relative;
}
.cart-badge-dot {
  position: absolute;
  top: 4px; right: 4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--primary);
  box-shadow: 0 0 6px var(--primary);
}

/* ─── Screens ───────────────────────────────────────── */
.screen {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 0.2s ease, visibility 0s 0.2s;
  background: var(--background);
}
.screen.active {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
  transition: opacity 0.2s ease, visibility 0s 0s;
}
/* Feed screen no scroll (snap) */
#screen-feed {
  overflow: hidden;
  background: #000;
}

/* ─── Bottom Nav ────────────────────────────────────── */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding-bottom: env(safe-area-inset-bottom, 8px);
  background: rgba(255,255,255,0.80);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
  z-index: 100;
  border-radius: 20px 20px 0 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 0;
  color: var(--secondary);
  opacity: 0.6;
  transition: color 0.15s, opacity 0.15s, transform 0.1s;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.04em;
  position: relative;
}
.nav-item.active {
  color: var(--primary);
  opacity: 1;
}
.nav-item.active::before {
  content: '';
  position: absolute;
  top: 0;
  width: 32px; height: 3px;
  border-radius: 0 0 4px 4px;
  background: var(--primary);
  box-shadow: 0 2px 8px var(--primary);
}
.nav-item:active { transform: scale(0.9); }
.nav-item .material-symbols-outlined { font-size: 26px; }
.nav-badge {
  position: absolute;
  top: 4px;
  right: calc(50% - 20px);
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--primary);
}

/* ─── FEED SCREEN ───────────────────────────────────── */
.feed-container {
  height: 100%;
  overflow-y: scroll;
  scroll-snap-type: y mandatory;
  -webkit-overflow-scrolling: touch;
}
.feed-item {
  height: 100dvh;
  scroll-snap-align: start;
  position: relative;
  background: #111;
  overflow: hidden;
}
.feed-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  transform: scale(1.05);
}
.feed-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 40%, rgba(0,0,0,0.2) 100%);
}
.feed-actions {
  position: absolute;
  right: 12px;
  bottom: 140px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}
.feed-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.5);
}
.feed-action-btn .icon-circle {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(255,255,255,0.3);
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s, transform 0.1s;
}
.feed-action-btn:active .icon-circle { transform: scale(0.85); }
.feed-action-btn.liked .icon-circle { background: rgba(176,0,74,0.6); }
.feed-action-btn .material-symbols-outlined { font-size: 24px; color: #fff; }
.feed-action-btn span:last-child {
  font-size: 11px; font-weight: 700;
  font-family: 'Hanken Grotesk', sans-serif;
  letter-spacing: 0.04em;
}
.feed-product-card {
  position: absolute;
  bottom: 72px;
  left: 12px;
  right: 72px;
  background: rgba(255,255,255,0.82);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 16px;
  padding: 12px 14px;
  cursor: pointer;
  transition: transform 0.15s;
}
.feed-product-card:active { transform: scale(0.97); }
.feed-product-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.feed-prices { display: flex; align-items: baseline; gap: 6px; margin-bottom: 8px; }
.feed-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px; font-weight: 800;
  color: var(--primary);
}
.feed-price-old {
  font-size: 13px; font-weight: 400;
  color: var(--secondary);
  text-decoration: line-through;
}
.feed-buy-btn {
  width: 100%;
  padding: 9px;
  border-radius: 12px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 0.04em;
  transition: opacity 0.15s, transform 0.1s;
}
.feed-buy-btn:active { transform: scale(0.97); opacity: 0.9; }
.feed-sale-chip {
  position: absolute;
  top: 12px; left: 12px;
  background: var(--primary-dark);
  color: #fff;
  font-size: 11px; font-weight: 700;
  padding: 3px 8px;
  border-radius: 99px;
  font-family: 'Hanken Grotesk', sans-serif;
  letter-spacing: 0.04em;
  animation: bounce-in 0.4s ease;
}
@keyframes bounce-in {
  0%{transform:scale(0.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}
}

/* ─── SHOP SCREEN ───────────────────────────────────── */
.shop-screen { padding-top: 60px; padding-bottom: 80px; }
.shop-header { padding: 16px 16px 8px; }
.shop-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 24px; font-weight: 700;
  color: var(--on-background);
  margin-bottom: 12px;
}
.category-chips {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.category-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  padding: 6px 14px;
  border-radius: 99px;
  font-size: 13px; font-weight: 600;
  font-family: 'Hanken Grotesk', sans-serif;
  border: 1.5px solid var(--outline-variant);
  color: var(--on-surface-variant);
  background: var(--surface-container-lowest);
  transition: all 0.15s;
  cursor: pointer;
}
.chip.active {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.chip:active { transform: scale(0.95); }
.products-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 12px 12px 0;
}
.product-card {
  background: var(--surface-container-lowest);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 4px 16px var(--shadow-pink-sm);
  cursor: pointer;
  transition: transform 0.15s, box-shadow 0.15s;
}
.product-card:active { transform: scale(0.97); }
.product-card-img {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  background: var(--surface-container);
  position: relative;
}
.product-card-img-wrap { position: relative; }
.product-card-fav {
  position: absolute;
  top: 8px; right: 8px;
  width: 32px; height: 32px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  z-index: 2;
  transition: transform 0.1s;
}
.product-card-fav:active { transform: scale(0.85); }
.product-card-fav .material-symbols-outlined { font-size: 18px; color: var(--on-surface-variant); }
.product-card-fav.active .material-symbols-outlined { color: var(--primary); }
.product-card-badge {
  position: absolute;
  bottom: 8px; left: 8px;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(6px);
  padding: 3px 8px;
  border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 800;
  color: var(--primary);
}
.product-card-info { padding: 10px 10px 12px; }
.product-card-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.product-card-sub {
  font-size: 11px; color: var(--on-surface-variant);
  margin-bottom: 4px;
}
.product-card-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 800;
  color: var(--primary);
}
.product-card-old {
  font-size: 11px; color: var(--secondary);
  text-decoration: line-through;
  margin-left: 4px;
}

/* ─── PRODUCT DETAIL SCREEN ─────────────────────────── */
.product-detail-screen { padding-top: 0; padding-bottom: 88px; }
.detail-gallery {
  position: relative;
  height: 55vh;
  overflow: hidden;
  background: var(--surface-container);
}
.detail-gallery img {
  width: 100%; height: 100%;
  object-fit: cover;
}
.detail-gallery-dots {
  position: absolute;
  bottom: 12px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 6px;
}
.detail-gallery-dots span {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
}
.detail-gallery-dots span.active { background: #fff; width: 18px; border-radius: 3px; }
.detail-back {
  position: absolute;
  top: 68px; left: 12px;
  width: 40px; height: 40px;
  border-radius: 50%;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; z-index: 10;
  color: var(--primary);
  transition: transform 0.1s;
}
.detail-back:active { transform: scale(0.9); }
.detail-body { padding: 20px 16px; background: var(--surface-container-lowest); border-radius: 20px 20px 0 0; margin-top: -16px; position: relative; }
.detail-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--on-surface);
  margin-bottom: 4px;
}
.detail-sub { font-size: 14px; color: var(--on-surface-variant); margin-bottom: 12px; }
.detail-prices { display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px; }
.detail-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 26px; font-weight: 800; color: var(--primary);
}
.detail-price-old { font-size: 15px; color: var(--secondary); text-decoration: line-through; }
.section-label {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--on-surface);
  margin-bottom: 10px;
}
.size-row { display: flex; gap: 8px; margin-bottom: 20px; }
.size-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: 1.5px solid var(--outline);
  color: var(--on-surface-variant);
  font-family: 'Hanken Grotesk', sans-serif;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s;
}
.size-btn.active { border-color: var(--primary); border-width: 2px; background: rgba(176,0,74,0.06); color: var(--primary); }
.size-btn:active { transform: scale(0.92); }
.color-row { display: flex; gap: 10px; margin-bottom: 20px; }
.color-swatch {
  width: 28px; height: 28px;
  border-radius: 50%;
  cursor: pointer;
  transition: transform 0.1s;
  position: relative;
}
.color-swatch.active::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 50%;
  border: 2px solid var(--primary);
}
.color-swatch:active { transform: scale(0.85); }
.detail-desc {
  font-size: 14px; line-height: 1.6;
  color: var(--on-surface-variant);
  margin-bottom: 24px;
}
.detail-add-btn {
  position: sticky;
  bottom: 80px;
  width: 100%;
  padding: 16px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 8px 24px rgba(176,0,74,0.35);
  z-index: 10;
  transition: opacity 0.15s, transform 0.1s;
  margin: 0 0 8px;
}
.detail-add-btn:active { transform: scale(0.97); }
.detail-add-btn .material-symbols-outlined { font-size: 20px; }
.reviews-row {
  display: flex; align-items: center; gap: 6px;
  margin-bottom: 16px;
}
.stars { color: #FFAA00; font-size: 14px; }
.reviews-count { font-size: 13px; color: var(--on-surface-variant); }

/* ─── CART SCREEN ───────────────────────────────────── */
.cart-screen { padding-top: 60px; padding-bottom: 80px; }
.cart-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px; font-weight: 700;
  color: var(--on-background);
}
.cart-count { font-size: 14px; color: var(--secondary); }
.cart-header { padding: 16px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
.cart-item {
  display: flex; gap: 12px;
  background: var(--surface-container-lowest);
  border-radius: 16px;
  padding: 12px;
  margin: 0 12px 10px;
  box-shadow: 0 3px 12px var(--shadow-pink-sm);
}
.cart-item-img {
  width: 80px; height: 100px;
  border-radius: 12px;
  object-fit: cover;
  background: var(--surface-container);
  flex-shrink: 0;
}
.cart-item-body { flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.cart-item-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--on-surface);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cart-item-variant { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
.cart-item-price {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 800; color: var(--primary);
}
.cart-item-price-old { font-size: 12px; color: var(--secondary); text-decoration: line-through; }
.qty-control {
  display: flex; align-items: center; gap: 4px;
  background: var(--surface-container-low);
  border-radius: 99px;
  padding: 2px 4px;
}
.qty-btn {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--on-surface-variant);
  transition: background 0.1s, transform 0.1s;
}
.qty-btn:active { background: var(--surface-container-high); transform: scale(0.85); }
.qty-btn .material-symbols-outlined { font-size: 18px; }
.qty-val {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 700;
  min-width: 24px; text-align: center;
}
.cart-item-footer { display: flex; align-items: center; justify-content: space-between; }
.cart-remove-btn { color: var(--secondary); transition: color 0.15s, transform 0.1s; }
.cart-remove-btn:active { transform: scale(0.85); color: var(--error); }
.cart-remove-btn .material-symbols-outlined { font-size: 20px; }
.cart-summary {
  margin: 8px 12px;
  background: var(--surface-container-lowest);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 4px 16px var(--shadow-pink-sm);
}
.cart-summary-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 600; color: var(--on-surface);
  margin-bottom: 12px;
}
.cart-row {
  display: flex; justify-content: space-between;
  font-size: 14px; color: var(--on-surface-variant);
  margin-bottom: 8px;
}
.cart-row.total {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px; font-weight: 700; color: var(--on-surface);
  border-top: 1px solid var(--surface-container-high);
  padding-top: 10px; margin-top: 4px;
}
.cart-row.total .price { color: var(--primary); }
.cart-row .discount { color: var(--primary); }
.cart-checkout-btn {
  width: 100%;
  padding: 15px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 6px 20px rgba(176,0,74,0.3);
  margin-top: 14px;
  transition: opacity 0.15s, transform 0.1s;
}
.cart-checkout-btn:active { transform: scale(0.98); opacity: 0.9; }
.cart-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  height: 50vh; gap: 16px;
  color: var(--on-surface-variant);
  text-align: center;
  padding: 32px;
}
.cart-empty .material-symbols-outlined { font-size: 64px; color: var(--outline); }
.cart-empty h3 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 18px; font-weight: 700; color: var(--on-surface);
}

/* ─── PROFILE SCREEN ────────────────────────────────── */
.profile-screen { padding-top: 60px; padding-bottom: 80px; }
.profile-hero {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  padding: 24px 16px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  color: #fff;
}
.profile-avatar {
  width: 80px; height: 80px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 32px; font-weight: 800;
  border: 3px solid rgba(255,255,255,0.4);
  overflow: hidden;
}
.profile-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px; font-weight: 700; }
.profile-email { font-size: 13px; opacity: 0.8; }
.profile-stats {
  display: flex; gap: 0;
  background: var(--surface-container-lowest);
  margin: -16px 16px 0;
  border-radius: 16px;
  box-shadow: 0 4px 20px var(--shadow-pink);
  position: relative; z-index: 5;
}
.profile-stat {
  flex: 1; padding: 14px 8px;
  text-align: center;
  border-right: 1px solid var(--surface-container-high);
}
.profile-stat:last-child { border-right: none; }
.profile-stat-val {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 20px; font-weight: 800; color: var(--primary);
}
.profile-stat-label { font-size: 11px; color: var(--on-surface-variant); margin-top: 2px; }
.profile-menu { margin: 20px 16px 0; }
.profile-section-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--on-surface-variant);
  margin-bottom: 8px; margin-left: 4px;
}
.profile-menu-item {
  display: flex; align-items: center; gap: 12px;
  padding: 14px;
  background: var(--surface-container-lowest);
  border-radius: 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: background 0.1s, transform 0.1s;
}
.profile-menu-item:active { background: var(--surface-container-low); transform: scale(0.98); }
.profile-menu-item .material-symbols-outlined { font-size: 22px; color: var(--primary); }
.profile-menu-item-label { flex: 1; font-size: 15px; font-weight: 500; color: var(--on-surface); }
.profile-menu-item .arrow { font-size: 18px; color: var(--outline); }

/* ─── FAVORITES SCREEN ──────────────────────────────── */
.fav-screen { padding-top: 60px; padding-bottom: 80px; }
.screen-header { padding: 16px 16px 8px; }
.screen-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 22px; font-weight: 700; color: var(--on-background);
}

/* ─── NOTIFICATIONS SCREEN ──────────────────────────── */
.notif-screen { padding-top: 60px; padding-bottom: 80px; }
.notif-item {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--surface-container-high);
  cursor: pointer;
  transition: background 0.1s;
}
.notif-item:active { background: var(--surface-container-low); }
.notif-item.unread { background: rgba(176,0,74,0.03); }
.notif-icon {
  width: 44px; height: 44px; flex-shrink: 0;
  border-radius: 50%; display: flex; align-items: center; justify-content: center;
}
.notif-icon.pink { background: var(--primary-fixed); }
.notif-icon.pink .material-symbols-outlined { color: var(--primary); font-size: 20px; }
.notif-icon.gray { background: var(--surface-container); }
.notif-icon.gray .material-symbols-outlined { color: var(--secondary); font-size: 20px; }
.notif-body { flex: 1; }
.notif-title { font-size: 14px; font-weight: 600; color: var(--on-surface); }
.notif-item.unread .notif-title { font-weight: 700; }
.notif-desc { font-size: 13px; color: var(--on-surface-variant); margin-top: 2px; line-height: 1.4; }
.notif-time { font-size: 11px; color: var(--outline); margin-top: 4px; }
.notif-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--primary); flex-shrink: 0; margin-top: 6px; }

/* ─── ORDERS SCREEN ─────────────────────────────────── */
.orders-screen { padding-top: 60px; padding-bottom: 80px; }
.order-card {
  background: var(--surface-container-lowest);
  border-radius: 16px;
  margin: 0 12px 12px;
  padding: 16px;
  box-shadow: 0 3px 12px var(--shadow-pink-sm);
  cursor: pointer;
  transition: transform 0.1s;
}
.order-card:active { transform: scale(0.98); }
.order-card-header {
  display: flex; justify-content: space-between; align-items: flex-start;
  margin-bottom: 10px;
}
.order-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--on-surface);
}
.order-date { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }
.order-status {
  font-size: 12px; font-weight: 700;
  padding: 4px 10px; border-radius: 99px;
}
.order-status.delivered { background: #E6F7EE; color: #1A7B45; }
.order-status.shipping { background: #FFF3E0; color: #E65100; }
.order-status.processing { background: var(--primary-fixed); color: var(--primary); }
.order-items-preview { display: flex; gap: 6px; margin-bottom: 10px; }
.order-thumb {
  width: 52px; height: 64px;
  border-radius: 10px;
  object-fit: cover;
  background: var(--surface-container);
}
.order-card-footer {
  display: flex; justify-content: space-between; align-items: center;
  border-top: 1px solid var(--surface-container-high);
  padding-top: 10px;
}
.order-total {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 800; color: var(--primary);
}

/* ─── CHECKOUT SCREEN ───────────────────────────────── */
.checkout-screen { padding-top: 60px; padding-bottom: 100px; }
.checkout-section {
  margin: 16px 12px;
  background: var(--surface-container-lowest);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 3px 12px var(--shadow-pink-sm);
}
.checkout-section-header {
  padding: 14px 16px;
  background: var(--surface-container-low);
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--surface-container-high);
}
.checkout-section-header .material-symbols-outlined { font-size: 20px; color: var(--primary); }
.checkout-section-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px; font-weight: 700; color: var(--on-surface);
}
.checkout-field { padding: 12px 16px; border-bottom: 1px solid var(--surface-container-high); }
.checkout-field:last-child { border-bottom: none; }
.checkout-field label { font-size: 11px; font-weight: 700; color: var(--on-surface-variant); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 4px; display: block; }
.checkout-field input, .checkout-field select {
  width: 100%;
  background: transparent; border: none; outline: none;
  font-size: 15px; color: var(--on-surface);
  font-family: 'Hanken Grotesk', sans-serif;
  padding: 2px 0;
}
.checkout-field input::placeholder { color: var(--outline); }
.payment-options { display: flex; flex-direction: column; gap: 0; }
.payment-option {
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  border-bottom: 1px solid var(--surface-container-high);
  cursor: pointer;
  transition: background 0.1s;
}
.payment-option:last-child { border-bottom: none; }
.payment-option:active { background: var(--surface-container-low); }
.payment-option input[type=radio] { accent-color: var(--primary); width: 18px; height: 18px; }
.payment-option-label { font-size: 14px; font-weight: 500; color: var(--on-surface); flex: 1; }
.payment-option .material-symbols-outlined { font-size: 22px; color: var(--on-surface-variant); }
.checkout-total-bar {
  position: sticky;
  bottom: 0;
  width: 100%;
  padding: 14px 16px env(safe-area-inset-bottom, 14px);
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(16px);
  box-shadow: 0 -4px 20px var(--shadow-pink);
  z-index: 10;
  display: flex; flex-direction: column; gap: 10px;
  margin-top: 8px;
}
.checkout-total-row { display: flex; justify-content: space-between; align-items: center; }
.checkout-total-label { font-size: 14px; color: var(--on-surface-variant); }
.checkout-total-val {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 20px; font-weight: 800; color: var(--primary);
}
.checkout-confirm-btn {
  width: 100%;
  padding: 14px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  box-shadow: 0 6px 20px rgba(176,0,74,0.3);
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity 0.15s, transform 0.1s;
}
.checkout-confirm-btn:active { transform: scale(0.98); opacity: 0.9; }

/* ─── ORDER CONFIRMATION ────────────────────────────── */
.confirm-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center;
  padding: 40px 24px; text-align: center;
  min-height: 100%;
  padding-top: 80px; padding-bottom: 100px;
}
.confirm-icon-wrap {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary-fixed), var(--primary));
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 24px;
  box-shadow: 0 12px 40px rgba(176,0,74,0.3);
  animation: pop-in 0.5s cubic-bezier(0.175,0.885,0.32,1.275) both;
}
@keyframes pop-in { from{transform:scale(0);opacity:0} to{transform:scale(1);opacity:1} }
.confirm-icon-wrap .material-symbols-outlined { font-size: 52px; color: #fff; }
.confirm-title {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 26px; font-weight: 800; color: var(--on-surface);
  margin-bottom: 8px;
}
.confirm-sub { font-size: 15px; color: var(--on-surface-variant); line-height: 1.5; margin-bottom: 32px; }
.confirm-order-box {
  background: var(--surface-container-lowest);
  border-radius: 16px;
  padding: 20px;
  width: 100%;
  margin-bottom: 32px;
  box-shadow: 0 4px 16px var(--shadow-pink-sm);
}
.confirm-order-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 700;
  color: var(--on-surface-variant); margin-bottom: 4px;
}
.confirm-order-id {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 20px; font-weight: 800; color: var(--primary);
}
.confirm-btn-row { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.confirm-primary-btn {
  padding: 15px;
  border-radius: 99px;
  background: linear-gradient(180deg, var(--surface-tint), var(--primary));
  color: #fff;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 16px; font-weight: 700;
  box-shadow: 0 6px 20px rgba(176,0,74,0.3);
  transition: transform 0.1s, opacity 0.15s;
}
.confirm-primary-btn:active { transform: scale(0.97); opacity: 0.9; }
.confirm-secondary-btn {
  padding: 14px;
  border-radius: 99px;
  border: 2px solid var(--outline-variant);
  color: var(--on-surface-variant);
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 15px; font-weight: 600;
  transition: transform 0.1s, background 0.1s;
}
.confirm-secondary-btn:active { background: var(--surface-container-low); transform: scale(0.97); }

/* ─── TOAST ─────────────────────────────────────────── */
.toast {
  position: fixed;
  bottom: 88px;
  left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--inverse-surface);
  color: var(--inverse-on-surface);
  padding: 10px 18px;
  border-radius: 99px;
  font-size: 13px; font-weight: 600;
  white-space: nowrap;
  z-index: 999;
  opacity: 0;
  transition: opacity 0.2s ease, transform 0.2s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ─── INSTALL BANNER ────────────────────────────────── */
.install-banner {
  position: fixed;
  top: 68px;
  left: 12px; right: 12px;
  background: var(--surface-container-lowest);
  border-radius: 16px;
  padding: 14px 16px;
  display: flex; align-items: center; gap: 12px;
  box-shadow: 0 8px 32px var(--shadow-pink);
  z-index: 200;
  transform: translateY(-120%);
  transition: transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);
  border: 1px solid var(--outline-variant);
}
.install-banner.show { transform: translateY(0); }
.install-banner-icon {
  width: 44px; height: 44px;
  border-radius: 12px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.install-banner-icon .material-symbols-outlined { color: #fff; font-size: 22px; }
.install-banner-text { flex: 1; }
.install-banner-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 700; color: var(--on-surface); }
.install-banner-sub { font-size: 12px; color: var(--on-surface-variant); }
.install-banner-btn {
  padding: 7px 14px;
  border-radius: 99px;
  background: var(--primary);
  color: #fff;
  font-size: 13px; font-weight: 700;
  font-family: 'Hanken Grotesk', sans-serif;
  flex-shrink: 0;
  transition: transform 0.1s, opacity 0.1s;
}
.install-banner-btn:active { transform: scale(0.95); opacity: 0.9; }
.install-banner-close {
  position: absolute; top: 8px; right: 8px;
  width: 24px; height: 24px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; color: var(--on-surface-variant);
}
.install-banner-close .material-symbols-outlined { font-size: 16px; }

/* ─── MISC ──────────────────────────────────────────── */
.material-symbols-outlined {

  font-weight: normal; font-style: normal;

}
.hidden { display: none !important; }
.scrollbar-hide { scrollbar-width: none; -ms-overflow-style: none; }

function navigateTo(screen, data) {
  // Deactivate all
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  // Activate
  document.getElementById('screen-' + screen)?.classList.add('active');
  if (NAV_SCREENS.includes(screen)) {
    document.getElementById('nav-' + screen)?.classList.add('active');
  }
  currentScreen = screen;
  // Scroll top-bar actions
  const leftIcon = document.getElementById('topBarLeftIcon');
  if (['product','cart','checkout','confirm','notifications'].includes(screen)) {
    leftIcon.textContent = 'arrow_back';
  } else {
    leftIcon.textContent = 'menu';
  }
  // Render
  if (screen === 'shop') renderShop();
  if (screen === 'cart') renderCart();
  if (screen === 'favorites') renderFavorites();
  if (screen === 'orders') renderOrders();
  if (screen === 'profile') renderProfile();
  if (screen === 'notifications') renderNotifications();
  if (screen === 'product' && data) { selectedProduct = data; selectedSize = data.sizes[1] || data.sizes[0]; selectedColor = 0; renderProductDetail(); }
  if (screen === 'checkout') renderCheckout();
  if (screen === 'confirm') renderConfirmation();
}

function handleTopLeft() {
  const backs = ['product','cart','checkout','confirm','notifications'];
  if (backs.includes(currentScreen)) {
    history.back();
    // Simple back logic
    if (currentScreen === 'product') navigateTo('shop');
    else if (currentScreen === 'cart') navigateTo('shop');
    else if (currentScreen === 'checkout') navigateTo('cart');
    else if (currentScreen === 'confirm') navigateTo('shop');
    else if (currentScreen === 'notifications') navigateTo('profile');
  }
}

function addToCart(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  if (!selectedSize) { showToast('Selecione um tamanho!'); return; }
  const key = productId + '-' + selectedSize;
  const existing = cart.find(i => i.key === key);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ key, productId, size: selectedSize, qty: 1 });
  }
  saveCart();
  showToast('✅ Adicionado à sacola!');
  updateCartBadge();
}

function quickAddToCart(productId) {
  const p = PRODUCTS.find(x => x.id === productId);
  const key = productId + '-M';
  const existing = cart.find(i => i.key === key);
  if (existing) existing.qty++;
  else cart.push({ key, productId, size: 'M', qty: 1 });
  saveCart();
  showToast('✅ Adicionado à sacola!');
  updateCartBadge();
}

function saveCart() {
  localStorage.setItem('bs_cart', JSON.stringify(cart));
}

function updateCartBadge() {
  const dot = document.getElementById('cartDot');
  const total = cart.reduce((s, i) => s + i.qty, 0);
  dot.style.display = total > 0 ? 'block' : 'none';
}

function changeQty(key, delta) {
  const item = cart.find(i => i.key === key);
  if (!item) return;
  item.qty = Math.max(0, item.qty + delta);
  if (item.qty === 0) cart = cart.filter(i => i.key !== key);
  saveCart();
  updateCartBadge();
  renderCart();
}

function removeCartItem(key) {
  cart = cart.filter(i => i.key !== key);
  saveCart();
  updateCartBadge();
  renderCart();
  showToast('Item removido');
}

function getCartTotals() {
  let sub = 0, discount = 0;
  cart.forEach(ci => {
    const p = PRODUCTS.find(x => x.id === ci.productId);
    if (!p) return;
    sub += p.price * ci.qty;
    if (p.oldPrice) discount += (p.oldPrice - p.price) * ci.qty;
  });
  return { sub, discount, total: sub };
}

  const content = document.getElementById('cartContent');
  const count = cart.reduce((s,i) => s + i.qty, 0);
  if (cart.length === 0) {

  const itemsHtml = cart.map(ci => {

    return `

          </div>

            <div class="qty-control">
              <button class="qty-btn" onclick="changeQty('${ci.key}', -1)">
                <span class="material-symbols-outlined">remove</span>
              </button>
              <span class="qty-val">${ci.qty}</span>
              <button class="qty-btn" onclick="changeQty('${ci.key}', 1)">
                <span class="material-symbols-outlined">add</span>
              </button>
            </div>
            <button class="cart-remove-btn" onclick="removeCartItem('${ci.key}')">
              <span class="material-symbols-outlined">delete_outline</span>
            </button>
          </div>
        </div>
      </div>`;
  }).join('');

  content.innerHTML = `

// ─────────────────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─────────────────────────────────────────────────────────
// PUSH NOTIFICATIONS
// ─────────────────────────────────────────────────────────
async function requestPushPermission() {
  if (!('Notification' in window)) { showToast('Notificações não suportadas'); return; }
  const perm = await Notification.requestPermission();
  if (perm === 'granted') showToast('🔔 Notificações ativadas!');
  else showToast('Notificações bloqueadas');
}

// ─────────────────────────────────────────────────────────
// PWA INSTALL
// ─────────────────────────────────────────────────────────
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredInstall = e;
  if (!localStorage.getItem('bs_install_dismissed')) {
    setTimeout(() => {
      document.getElementById('installBanner').classList.add('show');
    }, 3000);
  }
});

document.getElementById('installBtn').addEventListener('click', async () => {
  if (!deferredInstall) { showToast('Adicione à tela inicial pelo menu do browser'); return; }
  deferredInstall.prompt();
  const { outcome } = await deferredInstall.userChoice;
  if (outcome === 'accepted') showToast('BianaStore instalada! 🎉');
  deferredInstall = null;
  dismissInstall();
});

function dismissInstall() {
  document.getElementById('installBanner').classList.remove('show');
  localStorage.setItem('bs_install_dismissed', '1');
}

window.addEventListener('appinstalled', () => {
  showToast('BianaStore instalada! 🎉');
  dismissInstall();
});
