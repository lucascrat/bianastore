<!-- Video Background -->
<div class="absolute inset-0 z-0 bg-surface-container-highest w-full h-full md:w-[480px] md:h-[854px] md:top-1/2 md:-translate-y-1/2 md:rounded-xl overflow-hidden shadow-2xl">

<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-headline-lg-mobile" data-icon="menu">menu</span>
</button>
<div class="flex items-center gap-xs">
<img alt="BianaStore" class="w-8 h-8 rounded-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClne1-sX8eG9ztrVairGbbMVKpHEeP1rZ0Wy_8-mh6A_eocof20pd_dN3grvdNUEXBPUMPHEMRXTMJsAULf_md6fZE_HYrFK0rMjGT-HjAHCrtjhReHNeW_VuFuE6d2GeXAVJcIxlAYc7K6XwtLoy5fyf0fcnBy67yOD19Gng55lDo7h6wK0eQKhmOHx9afHZfog5VKe6-CK-VC7bNZQjFUEl7v6tKOb_aspxwfujv8nXVUts7uGQY"/>

</button>

<div class="h-16 shrink-0"></div>

<div class="flex-1"></div>
<!-- Bottom Overlay Controls -->
<div class="px-margin-mobile pb-sm flex justify-between items-end gap-gutter pointer-events-none relative z-20 w-full">

<div class="bg-white/80 backdrop-blur-xl rounded-xl p-sm shadow-[0px_10px_30px_rgba(216,27,96,0.1)] flex-1 max-w-[70%] pointer-events-auto border border-outline-variant/30 relative overflow-hidden group hover:-translate-y-1 transition-transform">
<div class="absolute inset-0 bg-gradient-to-tr from-primary-fixed/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
<h2 class="font-title-md text-title-md text-on-surface mb-base truncate">Vestido Midi Elegante</h2>
<div class="flex items-end gap-xs mb-xs">
<span class="font-price-tag text-price-tag text-primary animate-pulse-fast">R$ 199,00</span>
<span class="font-body-sm text-body-sm text-secondary line-through">R$ 299,00</span>
</div>
<button class="w-full bg-primary text-on-primary font-label-bold text-label-bold py-xs rounded-lg shadow-sm active:scale-95 transition-all bg-gradient-to-b from-primary to-primary-container">

</div>
<span class="text-white font-label-bold text-label-bold text-shadow-video">12.4K</span>
</button>
<button class="flex flex-col items-center gap-base group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center shadow-lg border border-white/30 group-hover:bg-white/40 transition-colors">
<span class="material-symbols-outlined text-white text-shadow-video" data-icon="chat_bubble">chat_bubble</span>
</div>
<span class="text-white font-label-bold text-label-bold text-shadow-video">842</span>
</button>
<button class="flex flex-col items-center gap-base group active:scale-90 transition-transform">
<div class="w-12 h-12 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center shadow-lg border border-white/30 group-hover:bg-white/40 transition-colors">

</div>
<span class="text-white font-label-bold text-label-bold text-shadow-video">Share</span>

</button>
<button class="flex flex-col items-center justify-center text-secondary opacity-70 hover:text-primary active:scale-90 transition-transform duration-150 group">
<span class="material-symbols-outlined mb-base group-hover:-translate-y-1 transition-transform" data-icon="person">person</span>
<span class="font-label-bold text-label-bold">Profile</span>
</button>
</nav>
<!-- Spacer for Bottom Nav -->
<div class="h-20 shrink-0 md:hidden"></div>
