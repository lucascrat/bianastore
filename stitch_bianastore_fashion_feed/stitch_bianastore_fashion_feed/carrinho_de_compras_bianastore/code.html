<span class="font-body-sm text-body-sm text-secondary line-through">R$ 299,90</span>

</div>

<button aria-label="Diminuir quantidade" class="w-8 h-8 flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">remove</span>
</button>
<span class="font-title-md text-title-md text-on-background w-6 text-center">1</span>
<button aria-label="Aumentar quantidade" class="w-8 h-8 flex items-center justify-center text-on-surface-variant active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px]">add</span>
</button>
</div>
<button aria-label="Remover item" class="text-secondary hover:text-error transition-colors p-2 active:scale-95">
<span class="material-symbols-outlined">delete_outline</span>
</button>
</div>
</div>
</div>

</div>

</div>
</div>
</div>
