<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BianaStore Admin — Estoque</title>
<link rel="stylesheet" href="admin.css"/>
<style>
  .filters { display:flex; gap:12px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .filters .field { margin-bottom:0; min-width:160px; }
  .filters .field input, .filters .field select { min-width:160px; }
  .swatch-cell { display:flex; align-items:center; gap:8px; }
  .swatch { width:20px; height:20px; border-radius:50%; border:1px solid var(--outline); flex-shrink:0; }
  .swatch.none { background:repeating-conic-gradient(#ddd 0% 25%, #fff 0% 50%) 50% / 8px 8px; }
  .stock-input { width:70px; padding:6px 8px; border:1px solid var(--outline); border-radius:8px; font-size:14px; }
  .stock-input.zero { border-color: var(--error); color: var(--error); font-weight:700; }
  .stock-input.low { border-color: #b8860b; color: #8a6d00; font-weight:700; }
  .summary-bar { display:flex; gap:24px; margin-bottom:16px; flex-wrap:wrap; }
  .summary-chip { background:var(--surface); border:1px solid var(--outline); border-radius:10px; padding:10px 16px; font-size:13px; }
  .summary-chip b { font-size:18px; display:block; font-family:'Plus Jakarta Sans',sans-serif; }
  .row-save-btn { padding:6px 12px; font-size:12px; }
  .empty-hint { color: var(--on-surface-variant); font-size: 14px; padding: 20px 0; text-align:center; }
</style>
</head>
<body>
<div class="topbar">
  <h1>BianaStore Admin</h1>
  <nav id="nav"></nav>
  <button class="btn secondary" onclick="logout()">Sair</button>
</div>
<main>
  <div class="toolbar">
    <h2>Estoque</h2>
  </div>

  <div class="summary-bar" id="summary"></div>

  <div class="filters">
    <div class="field">
      <label>Buscar produto</label>
      <input type="text" id="f-search" placeholder="Nome do produto..." oninput="debouncedLoad()"/>
    </div>
    <div class="field">
      <label>Cor</label>
      <select id="f-color" onchange="load()"><option value="">Todas</option></select>
    </div>
    <div class="field">
      <label>Tamanho</label>
      <select id="f-size" onchange="load()"><option value="">Todos</option></select>
    </div>
    <button class="btn secondary" onclick="clearFilters()">Limpar filtros</button>
  </div>

  <div class="card" style="padding:0">
    <table>
      <thead>
        <tr><th></th><th>Produto</th><th>Categoria</th><th>Cor</th><th>Tamanho</th><th>Estoque</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="8">Carregando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="admin.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('inventory');

let debounceTimer;
function debouncedLoad() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(load, 300);
}

function clearFilters() {
  document.getElementById('f-search').value = '';
  document.getElementById('f-color').value = '';
  document.getElementById('f-size').value = '';
  load();
}

function statusFor(stock) {
  if (stock <= 0) return { label: 'Esgotado', cls: 'cancelled' };
  if (stock <= 5) return { label: 'Estoque baixo', cls: 'processing' };
  return { label: 'Disponível', cls: 'delivered' };
}

async function load() {
  await requireAuth();
  const color = document.getElementById('f-color').value;
  const size = document.getElementById('f-size').value;
  const q = document.getElementById('f-search').value.trim();
  const params = new URLSearchParams();
  if (color) params.set('color', color);
  if (size) params.set('size', size);
  if (q) params.set('q', q);

  const { items, filters } = await api('/inventory?' + params.toString());

  // Populate filter dropdowns once with every value that exists (not just
  // the current filtered result), preserving whatever is currently selected.
  const colorSel = document.getElementById('f-color');
  const sizeSel = document.getElementById('f-size');
  if (colorSel.options.length <= 1) {
    colorSel.innerHTML = '<option value="">Todas</option>' + filters.colors.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    colorSel.value = color;
  }
  if (sizeSel.options.length <= 1) {
    sizeSel.innerHTML = '<option value="">Todos</option>' + filters.sizes.map((s) => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
    sizeSel.value = size;
  }

  renderSummary(items);
  renderRows(items);
}

function renderSummary(items) {
  const total = items.reduce((s, i) => s + i.stock, 0);
  const zero = items.filter((i) => i.stock <= 0).length;
  const low = items.filter((i) => i.stock > 0 && i.stock <= 5).length;
  document.getElementById('summary').innerHTML = `
    <div class="summary-chip">Peças em estoque<b>${total}</b></div>
    <div class="summary-chip">Variações esgotadas<b style="color:var(--error)">${zero}</b></div>
    <div class="summary-chip">Estoque baixo (≤5)<b style="color:#8a6d00">${low}</b></div>
    <div class="summary-chip">Variações listadas<b>${items.length}</b></div>
  `;
}

function renderRows(items) {
  const rows = document.getElementById('rows');
  if (!items.length) {
    rows.innerHTML = '<tr><td colspan="8"><div class="empty-hint">Nenhuma variação encontrada com esses filtros.</div></td></tr>';
    return;
  }
  rows.innerHTML = items.map((it) => {
    const st = statusFor(it.stock);
    const swatch = it.color
      ? `<span class="swatch" style="background:${escapeHtml(it.color)}"></span><span>${escapeHtml(it.color)}</span>`
      : `<span class="swatch none"></span><span>—</span>`;
    return `
      <tr id="variant-row-${it.id}">
        <td>${it.img ? `<img class="thumb" src="${escapeHtml(it.img)}"/>` : ''}</td>
        <td>${escapeHtml(it.productName)}${it.isActive === false ? ' <span class="badge inactive">inativo</span>' : ''}</td>
        <td>${escapeHtml(it.category || '—')}</td>
        <td><div class="swatch-cell">${swatch}</div></td>
        <td>${escapeHtml(it.size || '—')}</td>
        <td><input type="number" min="0" class="stock-input ${it.stock <= 0 ? 'zero' : it.stock <= 5 ? 'low' : ''}" id="stock-${it.id}" value="${it.stock}" oninput="markDirty(${it.id})"/></td>
        <td><span class="badge ${st.cls}" id="badge-${it.id}">${st.label}</span></td>
        <td><button class="btn secondary row-save-btn" id="save-${it.id}" onclick="saveVariant(${it.id})" disabled>Salvar</button></td>
      </tr>
    `;
  }).join('');
}

function markDirty(variantId) {
  document.getElementById(`save-${variantId}`).disabled = false;
}

async function saveVariant(variantId) {
  const input = document.getElementById(`stock-${variantId}`);
  const stock = Math.max(0, parseInt(input.value, 10) || 0);
  await api(`/inventory/${variantId}`, { method: 'PATCH', body: JSON.stringify({ stock }) });
  input.value = stock;
  input.className = 'stock-input' + (stock <= 0 ? ' zero' : stock <= 5 ? ' low' : '');
  const st = statusFor(stock);
  const badge = document.getElementById(`badge-${variantId}`);
  badge.className = `badge ${st.cls}`;
  badge.textContent = st.label;
  document.getElementById(`save-${variantId}`).disabled = true;
  showToast('Estoque atualizado!');
}

// Tiny local toast — this page doesn't share the storefront's showToast().
function showToast(msg) {
  let el = document.getElementById('adminToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'adminToast';
    el.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#191c1d;color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .2s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => (el.style.opacity = '0'), 1800);
}

load();
</script>
</body>
</html>
