<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BianaStore Admin — Clientes</title>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="topbar">
  <h1>BianaStore Admin</h1>
  <nav id="nav"></nav>
  <button class="btn secondary" onclick="logout()">Sair</button>
</div>
<main>
  <h2>Clientes</h2>
  <div class="card" style="padding:0">
    <table>
      <thead><tr><th></th><th>Nome</th><th>Email</th><th>Desde</th><th>Pedidos</th><th>Total gasto</th></tr></thead>
      <tbody id="rows"><tr><td colspan="6">Carregando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="admin.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('customers');

async function load() {
  await requireAuth();
  const customers = await api('/customers');
  const rows = document.getElementById('rows');
  if (!customers.length) {
    rows.innerHTML = '<tr><td colspan="6">Nenhum cliente cadastrado ainda.</td></tr>';
    return;
  }
  rows.innerHTML = customers.map((c) => `
    <tr>
      <td>${c.photo_url ? `<img class="thumb" src="${escapeHtml(c.photo_url)}"/>` : ''}</td>
      <td>${escapeHtml(c.name)}</td>
      <td>${escapeHtml(c.email)}</td>
      <td>${new Date(c.created_at).toLocaleDateString('pt-BR')}</td>
      <td>${c.orders_count}</td>
      <td>${fmtMoney(c.total_spent)}</td>
    </tr>
  `).join('');
}
load();
</script>
</body>
</html>
