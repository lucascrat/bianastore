<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BianaStore Admin — Pedido</title>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>
<div class="topbar">
  <h1>BianaStore Admin</h1>
  <nav id="nav"></nav>
  <button class="btn secondary" onclick="logout()">Sair</button>
</div>
<main>
  <div class="toolbar">
    <h2 id="title">Pedido</h2>
    <a class="btn secondary" href="/admin/orders.html">← Voltar</a>
  </div>
  <div id="content">Carregando…</div>
</main>
<script src="admin.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('orders');
const orderId = new URLSearchParams(location.search).get('id');

async function load() {
  await requireAuth();
  const o = await api(`/orders/${orderId}`);
  document.getElementById('title').textContent = `Pedido ${o.order_number}`;
  const addr = o.shipping_address || {};
  const recipient = addr.recipient || (o.customer && o.customer.name) || '';
  const phoneDigits = (addr.phone || '').replace(/\D/g, '');
  const paymentBadge = { paid: '<span class="badge delivered">Pago</span>', pending: '<span class="badge processing">Aguardando pagamento</span>', failed: '<span class="badge cancelled">Falhou</span>', refunded: '<span class="badge inactive">Reembolsado</span>' };
  document.getElementById('content').innerHTML = `
    <div class="card">
      <p><strong>Pagamento:</strong> ${paymentBadge[o.payment_status] || o.payment_status} — ${escapeHtml(o.payment_method)}${o.installments > 1 ? ` em ${o.installments}x` : ''}</p>
      ${o.customer ? `<p><strong>Cliente:</strong> ${escapeHtml(o.customer.name)} — ${escapeHtml(o.customer.email)}</p>` : '<p><strong>Cliente:</strong> compra sem cadastro</p>'}
    </div>
    <div class="card">
      <div class="row">
        <div class="field"><label>Status</label>
          <select id="status" onchange="document.getElementById('statusLabel').value = ORDER_STATUS[this.value].label">
            ${Object.keys(ORDER_STATUS).map((s) => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${ORDER_STATUS[s].label}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Rótulo mostrado ao cliente</label><input id="statusLabel" value="${escapeHtml(o.status_label)}"/></div>
      </div>
      <button class="btn" onclick="updateStatus()">Atualizar status</button>
      <span id="msg"></span>
    </div>

    <div class="card">
      <h2 style="font-size:16px">Entrega</h2>
      <p><strong>Destinatário:</strong> ${recipient ? escapeHtml(recipient) : '<span style="color:#b06a00">não informado</span>'}
      ${addr.phone ? `<br/><strong>Telefone:</strong> ${escapeHtml(addr.phone)}${phoneDigits ? ` — <a href="https://wa.me/55${phoneDigits}" target="_blank" rel="noopener">WhatsApp</a>` : ''}` : ''}</p>
      <p>${escapeHtml(addr.street || '')}, ${escapeHtml(addr.number || '')} ${escapeHtml(addr.complement || '')}<br/>
      ${escapeHtml(addr.neighborhood || '')} — ${escapeHtml(addr.city || '')}/${escapeHtml(addr.state || '')}<br/>
      CEP: ${escapeHtml(addr.cep || '')}</p>
    </div>

    <div class="card">
      <h2 style="font-size:16px">Itens</h2>
      <table>
        <thead><tr><th></th><th>Código</th><th>Produto</th><th>Tam.</th><th>Cor</th><th>Qtd</th><th>Preço</th></tr></thead>
        <tbody>
          ${o.items.map((i) => `
            <tr>
              <td>${i.product_image_snapshot ? `<img class="thumb" src="${escapeHtml(i.product_image_snapshot)}"/>` : ''}</td>
              <td><b>${i.product_id ? productCode(i.product_id) : '—'}</b></td>
              <td>${escapeHtml(i.product_name_snapshot)}</td>
              <td>${escapeHtml(i.size)}</td>
              <td>${i.color ? `<span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${escapeHtml(i.color)};border:1px solid var(--outline);vertical-align:middle"></span>` : '—'}</td>
              <td>${i.qty}</td>
              <td>${fmtMoney(i.unit_price)}</td>
            </tr>`).join('')}
        </tbody>
      </table>
      <div style="text-align:right;margin-top:12px;font-weight:700">
        Subtotal: ${fmtMoney(o.subtotal)}<br/>
        Desconto: ${fmtMoney(o.discount)}<br/>
        Frete: ${fmtMoney(o.shipping_cost)}<br/>
        <span style="font-size:18px;color:var(--primary)">Total: ${fmtMoney(o.total)}</span>
      </div>
    </div>
  `;
}

async function updateStatus() {
  const msg = document.getElementById('msg');
  try {
    await api(`/orders/${orderId}`, {
      method: 'PATCH',
      body: JSON.stringify({ status: document.getElementById('status').value, statusLabel: document.getElementById('statusLabel').value }),
    });
    msg.textContent = 'Atualizado!';
    msg.className = 'success-msg';
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'error-msg';
  }
}

load();
</script>
</body>
</html>
