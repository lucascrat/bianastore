<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BianaStore Admin — Produto</title>
<link rel="stylesheet" href="admin.css"/>
<style>
  .stock-grid-wrap { overflow-x:auto; }
  .stock-grid { border-collapse:collapse; }
  .stock-grid th, .stock-grid td { text-align:center; padding:8px 10px; border:1px solid var(--outline); font-size:13px; }
  .stock-grid th.corner { background:var(--surface-container); }
  .stock-grid .color-head { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .stock-grid .swatch { width:18px; height:18px; border-radius:50%; border:1px solid var(--outline); }
  .stock-grid input { width:64px; padding:5px; border:1px solid var(--outline); border-radius:6px; text-align:center; font-size:13px; }
  .stock-grid input.zero { border-color: var(--error); color: var(--error); font-weight:700; }
  .stock-hint { color: var(--on-surface-variant); font-size: 13px; }

  .color-palette { display:flex; flex-wrap:wrap; gap:12px; margin:8px 0 4px; padding:14px; background:var(--surface-container); border-radius:12px; }
  .color-swatch-item { display:flex; flex-direction:column; align-items:center; gap:5px; cursor:pointer; width:60px; user-select:none; }
  .color-swatch-item .dot { width:34px; height:34px; border-radius:50%; border:2px solid var(--outline); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05); transition: transform .12s, border-color .15s, box-shadow .15s; }
  .color-swatch-item:active .dot { transform: scale(0.88); }
  .color-swatch-item.selected .dot { border-color: var(--primary); border-width:3px; transform: scale(1.08); box-shadow: 0 2px 6px rgba(176,0,74,0.35); }
  .color-swatch-item .label { font-size:10.5px; color:var(--on-surface-variant); text-align:center; line-height:1.25; }
  .color-swatch-item.selected .label { color: var(--primary); font-weight:700; }
  .color-selected-row { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; min-height:22px; }
  .color-empty-hint { font-size:13px; color:var(--on-surface-variant); }
  .color-chip { display:flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--outline); border-radius:99px; padding:5px 10px 5px 5px; font-size:12.5px; }
  .color-chip .dot { width:18px; height:18px; border-radius:50%; border:1px solid var(--outline); flex-shrink:0; }
  .color-chip button { background:none; border:none; cursor:pointer; color:var(--on-surface-variant); font-size:15px; line-height:1; padding:0 2px; }
  .color-chip button:hover { color: var(--error); }
  .color-custom-row { display:flex; gap:10px; align-items:center; margin-top:10px; }
  .color-custom-row input[type=color] { width:44px; height:38px; padding:2px; border:1px solid var(--outline); border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="topbar">
  <h1>BianaStore Admin</h1>
  <nav id="nav"></nav>
  <button class="btn secondary" onclick="logout()">Sair</button>
</div>
<main>
  <div class="toolbar">
    <h2 id="title">Novo Produto</h2>
    <a class="btn secondary" href="/admin/index.html">← Voltar</a>
  </div>

  <div class="card">
    <div class="row">
      <div class="field"><label>Nome</label><input id="name"/></div>
      <div class="field"><label>Categoria</label><select id="categoryId"></select></div>
    </div>
    <div class="field"><label>Subtítulo</label><input id="sub" placeholder="Ex: Crepe de seda fluido"/></div>
    <div class="row">
      <div class="field"><label>Preço (R$)</label><input id="price" type="number" step="0.01"/></div>
      <div class="field"><label>Preço antigo (opcional, para desconto)</label><input id="oldPrice" type="number" step="0.01"/></div>
    </div>
    <div class="field"><label>Tamanhos (separados por vírgula)</label><input id="sizes" placeholder="P, M, G, GG"/></div>

    <div class="field">
      <label>Cores disponíveis</label>
      <div class="color-palette" id="colorPalette"></div>
      <div class="color-selected-row" id="selectedColorsRow"></div>
      <div class="color-custom-row">
        <input type="color" id="customColorPicker" value="#b0004a" title="Escolher cor personalizada"/>
        <button type="button" class="btn secondary" onclick="addCustomColor()">+ Adicionar cor personalizada</button>
      </div>
    </div>
    <div class="field"><label>Descrição</label><textarea id="description"></textarea></div>
    <div class="row">
      <div class="field"><label>Avaliação (0-5)</label><input id="rating" type="number" step="0.1" min="0" max="5"/></div>
      <div class="field"><label>Nº de avaliações</label><input id="reviewsCount" type="number" min="0"/></div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="isActive" checked style="width:auto"/> Produto ativo (visível na loja)</label>
    </div>

    <div class="field">
      <label>Imagens / Vídeo</label>
      <input type="file" id="fileInput" accept="image/*,video/mp4,video/webm" multiple/>
      <div class="gallery" id="gallery"></div>
      <div class="error-msg" id="uploadErr" style="display:none"></div>
    </div>

    <button class="btn" onclick="save()">Salvar</button>
    <span id="saveMsg"></span>
  </div>

  <div class="card" id="stockCard" style="display:none">
    <div class="toolbar" style="margin-bottom:12px">
      <h2 style="margin:0;font-size:18px">Estoque por cor e tamanho</h2>
      <button class="btn secondary" onclick="saveStock()">Salvar estoque</button>
    </div>
    <p class="stock-hint">Editou cores/tamanhos acima? Clique em "Salvar" primeiro — a grade se atualiza sozinha com as novas combinações.</p>
    <div class="stock-grid-wrap"><div id="stockGrid"></div></div>
    <span id="stockMsg"></span>
  </div>
</main>
<script src="admin.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('products');
const params = new URLSearchParams(location.search);
const productId = params.get('id');
let images = [];

// Curated palette of common clothing colors — replaces the old "type a hex
// code by hand" field. Admin just clicks; a native color picker below
// covers anything not in this list. Only the hex values are ever actually
// stored (products.colors stays a plain array of hex strings, same as
// before) — the names here are purely a display/labeling convenience.
const COLOR_PALETTE = [
  { name: 'Preto', hex: '#191c1d' },
  { name: 'Branco', hex: '#FFFFFF' },
  { name: 'Cinza Claro', hex: '#C4C4C4' },
  { name: 'Cinza Chumbo', hex: '#4A4A4A' },
  { name: 'Bege', hex: '#E8DCC8' },
  { name: 'Nude', hex: '#E8C4A0' },
  { name: 'Marrom', hex: '#6B4423' },
  { name: 'Vinho', hex: '#6B1F2A' },
  { name: 'Vermelho', hex: '#C41E3A' },
  { name: 'Rosa Claro', hex: '#F5C2C7' },
  { name: 'Rosa Pink', hex: '#E91E8C' },
  { name: 'Laranja', hex: '#E8804A' },
  { name: 'Amarelo', hex: '#F0D264' },
  { name: 'Verde', hex: '#4A7856' },
  { name: 'Verde Militar', hex: '#6B7355' },
  { name: 'Azul Marinho', hex: '#1F3A5F' },
  { name: 'Azul Serenity', hex: '#A8C5D6' },
  { name: 'Roxo', hex: '#6B4A7A' },
  { name: 'Dourado', hex: '#C9A961' },
  { name: 'Prata', hex: '#C0C0C0' },
];
let selectedColors = []; // array of hex strings — source of truth for the "colors" field

function renderColorPalette() {
  document.getElementById('colorPalette').innerHTML = COLOR_PALETTE.map((c) => {
    const isSelected = selectedColors.some((s) => s.toLowerCase() === c.hex.toLowerCase());
    return `
      <div class="color-swatch-item ${isSelected ? 'selected' : ''}" onclick="toggleColor('${c.hex}')" title="${c.name} (${c.hex})">
        <div class="dot" style="background:${c.hex}"></div>
        <div class="label">${c.name}</div>
      </div>`;
  }).join('');
  renderSelectedColors();
}

function renderSelectedColors() {
  const row = document.getElementById('selectedColorsRow');
  if (!selectedColors.length) {
    row.innerHTML = '<span class="color-empty-hint">Nenhuma cor selecionada ainda — clique na paleta acima.</span>';
    return;
  }
  row.innerHTML = selectedColors.map((hex) => {
    const known = COLOR_PALETTE.find((c) => c.hex.toLowerCase() === hex.toLowerCase());
    return `
      <div class="color-chip">
        <span class="dot" style="background:${hex}"></span>
        <span>${known ? known.name : hex}</span>
        <button type="button" onclick="removeColor('${hex}')" title="Remover">×</button>
      </div>`;
  }).join('');
}

function toggleColor(hex) {
  const idx = selectedColors.findIndex((s) => s.toLowerCase() === hex.toLowerCase());
  if (idx >= 0) selectedColors.splice(idx, 1);
  else selectedColors.push(hex);
  renderColorPalette();
}

function removeColor(hex) {
  selectedColors = selectedColors.filter((s) => s.toLowerCase() !== hex.toLowerCase());
  renderColorPalette();
}

function addCustomColor() {
  const hex = document.getElementById('customColorPicker').value;
  if (!selectedColors.some((s) => s.toLowerCase() === hex.toLowerCase())) {
    selectedColors.push(hex);
    renderColorPalette();
  }
}

async function init() {
  await requireAuth();
  renderColorPalette();
  const categories = await api('/categories');
  document.getElementById('categoryId').innerHTML =
    '<option value="">— sem categoria —</option>' +
    categories.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');

  if (productId) {
    document.getElementById('title').textContent = 'Editar Produto';
    const products = await api('/products');
    const p = products.find((x) => String(x.id) === productId);
    if (!p) return;
    document.getElementById('name').value = p.name || '';
    sub.value = p.sub || '';
    price.value = p.price || '';
    oldPrice.value = p.old_price || '';
    categoryId.value = p.category_id || '';
    selectedColors = (p.colors || []).slice();
    renderColorPalette();
    sizes.value = (p.sizes || []).join(', ');
    description.value = p.description || '';
    rating.value = p.rating || '';
    reviewsCount.value = p.reviews_count || '';
    isActive.checked = p.is_active !== false;
    images = p.images || [];
    renderGallery();
    document.getElementById('stockCard').style.display = '';
    loadStockGrid();
  }

  document.getElementById('fileInput').addEventListener('change', handleUpload);
}

// Renders a colors × sizes grid (each axis falls back to a single "—"
// column/row when the product has none of that option) with one stock input
// per cell, pre-filled from whatever variants already exist in the DB.
async function loadStockGrid() {
  const variants = await api(`/products/${productId}/variants`);
  const stockByKey = {};
  variants.forEach((v) => { stockByKey[`${v.color}|${v.size}`] = v.stock; });

  const productColors = selectedColors;
  const productSizes = sizes.value.split(',').map((s) => s.trim()).filter(Boolean);
  const colorList = productColors.length ? productColors : [''];
  const sizeList = productSizes.length ? productSizes : [''];

  const grid = document.getElementById('stockGrid');
  grid.innerHTML = `
    <table class="stock-grid">
      <thead>
        <tr>
          <th class="corner">Tamanho ↓ / Cor →</th>
          ${colorList.map((c) => `<th>${c ? `<div class="color-head"><span class="swatch" style="background:${escapeHtml(c)}"></span><span>${escapeHtml(c)}</span></div>` : 'Sem cor'}</th>`).join('')}
        </tr>
      </thead>
      <tbody>
        ${sizeList.map((s) => `
          <tr>
            <th>${escapeHtml(s || 'Único')}</th>
            ${colorList.map((c) => {
              const key = `${c}|${s}`;
              const stock = stockByKey[key] ?? 0;
              return `<td><input type="number" min="0" class="${stock <= 0 ? 'zero' : ''}" data-color="${escapeHtml(c)}" data-size="${escapeHtml(s)}" value="${stock}"/></td>`;
            }).join('')}
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

async function saveStock() {
  const inputs = document.querySelectorAll('#stockGrid input');
  const variants = Array.from(inputs).map((inp) => ({
    color: inp.dataset.color,
    size: inp.dataset.size,
    stock: Math.max(0, parseInt(inp.value, 10) || 0),
  }));
  const msg = document.getElementById('stockMsg');
  try {
    await api(`/products/${productId}/variants`, { method: 'PUT', body: JSON.stringify({ variants }) });
    msg.textContent = 'Estoque salvo!';
    msg.className = 'success-msg';
    loadStockGrid();
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'error-msg';
  }
}

function renderGallery() {
  document.getElementById('gallery').innerHTML = images.map((img) => `
    <div class="thumb-wrap">
      <img src="${escapeHtml(img.url)}" class="${img.isPrimary ? 'is-primary' : ''}" onclick="setPrimary(${img.id})" title="Clique para definir como principal"/>
      <button class="remove-btn" onclick="removeImage(${img.id})">×</button>
    </div>
  `).join('');
}

async function handleUpload(e) {
  const errEl = document.getElementById('uploadErr');
  errEl.style.display = 'none';
  if (!productId) {
    errEl.textContent = 'Salve o produto primeiro, depois envie as imagens.';
    errEl.style.display = 'block';
    e.target.value = '';
    return;
  }
  for (const file of e.target.files) {
    const form = new FormData();
    form.append('file', file);
    try {
      const { url } = await api('/media/upload', { method: 'POST', body: form });
      const img = await api(`/products/${productId}/images`, {
        method: 'POST',
        body: JSON.stringify({ url, isPrimary: images.length === 0 }),
      });
      images.push(img);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
    }
  }
  renderGallery();
  e.target.value = '';
}

async function setPrimary(imageId) {
  await api(`/products/${productId}/images`, {
    method: 'POST',
    body: JSON.stringify({ url: images.find((i) => i.id === imageId).url, isPrimary: true }),
  });
  images.forEach((i) => (i.isPrimary = i.id === imageId));
  renderGallery();
}

async function removeImage(imageId) {
  await api(`/products/${productId}/images/${imageId}`, { method: 'DELETE' });
  images = images.filter((i) => i.id !== imageId);
  renderGallery();
}

async function save() {
  // Was "name.value" — "name" is a real, always-present browser global
  // (window.name, a plain string used for cross-window messaging), and it
  // silently wins over the auto-exposed reference to <input id="name">. So
  // this line was reading/writing a string's nonexistent .value (undefined)
  // instead of the actual field — every save silently sent name:undefined,
  // which the server's "create" validation rejected outright and the
  // "update" route had no such guard for, so it would have hit products.name's
  // NOT NULL constraint and failed with a raw 500 on every single edit.
  const payload = {
    name: document.getElementById('name').value,
    sub: sub.value,
    price: parseFloat(price.value),
    oldPrice: oldPrice.value ? parseFloat(oldPrice.value) : null,
    categoryId: categoryId.value || null,
    colors: selectedColors,
    sizes: sizes.value.split(',').map((s) => s.trim()).filter(Boolean),
    description: description.value,
    rating: rating.value ? parseFloat(rating.value) : 0,
    reviewsCount: reviewsCount.value ? parseInt(reviewsCount.value, 10) : 0,
    isActive: isActive.checked,
  };
  const msg = document.getElementById('saveMsg');
  try {
    if (productId) {
      await api(`/products/${productId}`, { method: 'PUT', body: JSON.stringify(payload) });
      msg.textContent = 'Salvo!';
      msg.className = 'success-msg';
      document.getElementById('stockCard').style.display = '';
      loadStockGrid();
    } else {
      const created = await api('/products', { method: 'POST', body: JSON.stringify(payload) });
      window.location.href = `/admin/product-edit.html?id=${created.id}`;
      return;
    }
  } catch (err) {
    msg.textContent = err.message;
    msg.className = 'error-msg';
  }
}

init();
</script>
</body>
</html>
