<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BianaStore Admin — Frete</title>
<link rel="stylesheet" href="admin.css"/>
<style>
  .zone-form { display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-bottom:16px; }
  .zone-form .field { margin-bottom:0; }
  .zone-form input { width:100px; }
  .zone-form input#new-states { width:220px; }
  .zone-form input#new-name { width:140px; }
  table input { padding:5px 7px; border:1px solid var(--outline); border-radius:6px; font-size:13px; width:70px; }
  table input.wide { width:180px; }
</style>
</head>
<body>
<div class="topbar">
  <h1>BianaStore Admin</h1>
  <nav id="nav"></nav>
  <button class="btn secondary" onclick="logout()">Sair</button>
</div>
<main>
  <h2>Frete por região</h2>
  <p style="color:var(--on-surface-variant);font-size:14px;margin-top:-8px">Cada zona cobre uma lista de estados (UF). O frete "Padrão" fica grátis automaticamente acima de R$ 299 — o valor abaixo só vale pra pedidos menores.</p>
  <div class="error-msg" id="overlapWarning" style="display:none"></div>

  <div class="card">
    <h3 style="margin:0 0 12px">Nova zona</h3>
    <div class="zone-form">
      <div class="field"><label>Nome</label><input id="new-name" placeholder="Ex: Sudeste"/></div>
      <div class="field"><label>Estados (UF, vírgula)</label><input id="new-states" placeholder="SP, RJ, MG, ES"/></div>
      <div class="field"><label>Padrão R$</label><input id="new-std-cost" type="number" step="0.01" value="9.90"/></div>
      <div class="field"><label>Padrão dias</label><input id="new-std-days" type="number" value="5"/></div>
      <div class="field"><label>Expresso R$</label><input id="new-exp-cost" type="number" step="0.01" value="19.90"/></div>
      <div class="field"><label>Expresso dias</label><input id="new-exp-days" type="number" value="2"/></div>
      <button class="btn" onclick="createZone()">Adicionar</button>
    </div>
    <div class="error-msg" id="createErr" style="display:none"></div>
  </div>

  <div class="card" style="padding:0">
    <table>
      <thead><tr><th>Nome</th><th>Estados</th><th>Padrão R$</th><th>Dias</th><th>Expresso R$</th><th>Dias</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="7">Carregando…</td></tr></tbody>
    </table>
  </div>
</main>
<script src="admin.js"></script>
<script>
document.getElementById('nav').innerHTML = renderNav('shipping');
let zones = [];

async function load() {
  await requireAuth();
  zones = await api('/shipping-zones');
  checkOverlaps();
  render();
}

// A state claimed by two zones is silently ambiguous (whichever has the
// lower sort_order just wins, with no indication anything's wrong) — this
// won't stop you from saving it, but at least surfaces it clearly so it's
// never an accident.
function checkOverlaps() {
  const seenBy = {};
  const overlapping = new Set();
  zones.forEach((z) => {
    (z.states || []).forEach((uf) => {
      if (seenBy[uf] && seenBy[uf] !== z.name) overlapping.add(`${uf} (${seenBy[uf]} e ${z.name})`);
      seenBy[uf] = z.name;
    });
  });
  const el = document.getElementById('overlapWarning');
  if (overlapping.size) {
    el.textContent = `⚠️ Estado(s) em mais de uma zona: ${Array.from(overlapping).join(', ')} — só a zona de ordem menor é usada.`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function render() {
  const rows = document.getElementById('rows');
  if (!zones.length) { rows.innerHTML = '<tr><td colspan="7">Nenhuma zona cadastrada — todo frete vai cair no valor padrão de fallback.</td></tr>'; return; }
  rows.innerHTML = zones.map((z) => `
    <tr id="zone-${z.id}">
      <td><input class="wide" id="name-${z.id}" value="${escapeHtml(z.name)}"/></td>
      <td><input class="wide" id="states-${z.id}" value="${(z.states || []).join(', ')}"/></td>
      <td><input id="std-cost-${z.id}" type="number" step="0.01" value="${z.standard_cost}"/></td>
      <td><input id="std-days-${z.id}" type="number" value="${z.standard_days}"/></td>
      <td><input id="exp-cost-${z.id}" type="number" step="0.01" value="${z.express_cost}"/></td>
      <td><input id="exp-days-${z.id}" type="number" value="${z.express_days}"/></td>
      <td>
        <button class="btn secondary" onclick="saveZone(${z.id})">Salvar</button>
        <button class="btn danger" onclick="deleteZone(${z.id}, '${escapeHtml(z.name)}')">Excluir</button>
      </td>
    </tr>
  `).join('');
}

function parseStates(raw) {
  return raw.split(',').map((s) => s.trim().toUpperCase()).filter(Boolean);
}

async function createZone() {
  const err = document.getElementById('createErr');
  err.style.display = 'none';
  const states = parseStates(document.getElementById('new-states').value);
  const name = document.getElementById('new-name').value.trim();
  if (!name || !states.length) { err.textContent = 'Informe o nome e ao menos um estado.'; err.style.display = 'block'; return; }
  try {
    await api('/shipping-zones', {
      method: 'POST',
      body: JSON.stringify({
        name, states,
        standardCost: parseFloat(document.getElementById('new-std-cost').value) || 0,
        standardDays: parseInt(document.getElementById('new-std-days').value, 10) || 5,
        expressCost: parseFloat(document.getElementById('new-exp-cost').value) || 0,
        expressDays: parseInt(document.getElementById('new-exp-days').value, 10) || 2,
        sortOrder: zones.length,
      }),
    });
    document.getElementById('new-name').value = '';
    document.getElementById('new-states').value = '';
    load();
  } catch (e) { err.textContent = e.message; err.style.display = 'block'; }
}

async function saveZone(id) {
  await api(`/shipping-zones/${id}`, {
    method: 'PUT',
    body: JSON.stringify({
      name: document.getElementById(`name-${id}`).value.trim(),
      states: parseStates(document.getElementById(`states-${id}`).value),
      standardCost: parseFloat(document.getElementById(`std-cost-${id}`).value) || 0,
      standardDays: parseInt(document.getElementById(`std-days-${id}`).value, 10) || 5,
      expressCost: parseFloat(document.getElementById(`exp-cost-${id}`).value) || 0,
      expressDays: parseInt(document.getElementById(`exp-days-${id}`).value, 10) || 2,
    }),
  });
  load();
}

async function deleteZone(id, name) {
  if (!confirm(`Excluir a zona "${name}"? Estados dela passam a usar o frete padrão de fallback.`)) return;
  await api(`/shipping-zones/${id}`, { method: 'DELETE' });
  load();
}

load();
</script>
</body>
</html>
